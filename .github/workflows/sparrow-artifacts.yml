name: Sparrow artifacts

on:
  push:
    branches: [sparrow]
    paths:
      - "kernel/**"
      - "userspace/ksud/**"
      - ".github/workflows/sparrow-artifacts.yml"
  pull_request:
    branches: [sparrow]
    paths:
      - "kernel/**"
      - "userspace/ksud/**"
      - ".github/workflows/sparrow-artifacts.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (tag pushes publish automatically)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  KMI: android12-5.10
  # r27d (NDK 27.3.13750724). A numeric revision makes setup-ndk request a
  # non-existent URL and 404.
  NDK_VERSION: r27d
  OTA_URL: ${{ vars.OTA_URL }}
jobs:
  lkm:
    name: LKM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache kernel tree
        uses: actions/cache@v6
        with:
          path: .lkm-work/kernel
          key: kdir-5.10.198-${{ runner.os }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev xz-utils cpio rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Build kernelsu.ko
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          bash kernel/kheaders/build-lkm.sh

      - name: Verify module
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          KO=dist/kernelsu.ko
          modinfo "$KO" | grep -E '^(name|vermagic):'
          test "$(modinfo -F name "$KO")" = kernelsu
          test "$(modinfo -F vermagic "$KO" | awk '{print $1}')" = \
            5.10.198-perf-gaaf872b28b70-ab117
          # __versions must be empty or the loader rejects the module.
          test "$(readelf -S -W "$KO" | awk '/__versions/{print $6}')" = "000000"
          # The direct syscall hooks are the whole point of this build.
          for f in setresuid execve execveat newfstatat faccessat; do
            nm "$KO" | grep -q "ksu_direct_$f$" || {
              echo "missing ksu_direct_$f" >&2; exit 1; }
          done
          # A DDK/GKI build would have the wrong task_struct offsets; the
          # device offsets are only correct when TSK_STACK_CANARY is 1744.
          test "$(awk '{if ($2 == "TSK_STACK_CANARY") print $3;}' \
                 .lkm-work/kernel/include/generated/asm-offsets.h)" = 1744
          llvm-strip -d -R .note.gnu.build-id -o dist/stripped.ko "$KO"
          mv dist/stripped.ko dist/bakasu-sparrow-targetcfg.ko
          # The version code comes from the git commit count, so this hash
          # changes with every commit and cannot be pinned here.  Consumers pin
          # the hash published in the release's sha256sum.txt.
          sha256sum dist/bakasu-sparrow-targetcfg.ko

      - uses: actions/upload-artifact@v7
        with:
          name: lkm
          path: dist/bakasu-sparrow-targetcfg.ko
          if-no-files-found: error

  ksud:
    name: ksud
    runs-on: ubuntu-latest
    needs: lkm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ksud-${{ runner.os }}-${{ hashFiles('userspace/ksud/Cargo.lock') }}
          restore-keys: ksud-${{ runner.os }}-

      - uses: actions/download-artifact@v8
        with:
          name: lkm
          path: lkm

      - name: Embed LKM for late-load
        run: |
          mkdir -p userspace/ksud/bin/aarch64
          cp lkm/bakasu-sparrow-targetcfg.ko \
            userspace/ksud/bin/aarch64/${KMI}_kernelsu.ko

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          DIR=$(dirname "$(find /usr/lib -name 'libclang-*.so*' | sort | tail -1)")
          echo "LIBCLANG_PATH=$DIR" >> "$GITHUB_ENV"
          echo "libclang: $DIR"

      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          RUSTUP_TOOLCHAIN: nightly
        run: |
          rustup default nightly
          rustup component add rust-src
          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-linux-android26 \
            --sysroot=$SYSROOT -I$SYSROOT/usr/include \
            -I$SYSROOT/usr/include/aarch64-linux-android"
          "$NDK/clang" --target=aarch64-linux-gnu -c -nostdlib \
            -o userspace/ksud/.lkm_image_bootstrap.o \
            userspace/ksud/src/lkm_image_bootstrap.S
          cd userspace/ksud
          CC_aarch64_linux_android="$NDK/aarch64-linux-android26-clang" \
          CXX_aarch64_linux_android="$NDK/aarch64-linux-android26-clang++" \
          AR_aarch64_linux_android="$NDK/llvm-ar" \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/aarch64-linux-android26-clang" \
          cargo build --target aarch64-linux-android --release
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp target/aarch64-linux-android/release/ksud "$GITHUB_WORKSPACE/dist/ksud"
          chmod 755 "$GITHUB_WORKSPACE/dist/ksud"

      - uses: actions/upload-artifact@v7
        with:
          name: ksud
          path: dist/ksud
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lkm, ksud]
    if: ${{ github.ref_type == 'tag' || inputs.publish == true }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        shell: bash
        run: |
          ls -l
          sha256sum ksud bakasu-sparrow-targetcfg.ko > sha256sum.txt
          cat sha256sum.txt

      - id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/sha256sum.txt
          push-to-registry: false

      - name: Keep attestation bundle with the release
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'sparrow-artifacts-35255' }}
          name: Sparrow artifacts (driver 35255)
          body: |
            > Generated by the sparrow artifacts workflow
            please verify each file against sha256sum.txt before use!!

            kernel driver 35255 for the Pico 4 Ultra (sparrow),
            5.10.198-perf-gaaf872b28b70-ab117
          files: |
            dist/ksud
            dist/bakasu-sparrow-targetcfg.ko
            dist/sha256sum.txt
            dist/attestation.json
          fail_on_unmatched_files: true
          prerelease: ${{ github.ref_type != 'tag' }}
