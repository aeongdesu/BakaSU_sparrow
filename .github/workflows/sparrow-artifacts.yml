name: Sparrow artifacts

on:
  push:
    branches: [sparrow]
    paths:
      - "kernel/**"
      - "userspace/ksud/**"
      - ".github/workflows/sparrow-artifacts.yml"
  pull_request:
    branches: [sparrow]
    paths:
      - "kernel/**"
      - "userspace/ksud/**"
      - ".github/workflows/sparrow-artifacts.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (tag pushes publish automatically)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  KMI: android12-5.10
  NDK_VERSION: 27.3.13750724
  DDK_IMAGE: ghcr.io/ylarod/ddk-min:android12-5.10-20260828

jobs:
  lkm:
    name: LKM
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android12-5.10-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build kernelsu.ko
        run: |
          cd kernel
          CONFIG_KSU=m CONFIG_KSU_MULTI_MANAGER_SUPPORT=y \
            CONFIG_KSU_TRACEPOINT_HOOK=y CC=clang make
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp kernelsu.ko "$GITHUB_WORKSPACE/dist/bakasu-sparrow-targetcfg.ko"
          llvm-strip -d "$GITHUB_WORKSPACE/dist/bakasu-sparrow-targetcfg.ko"
          modinfo "$GITHUB_WORKSPACE/dist/bakasu-sparrow-targetcfg.ko" | grep -E '^(name|vermagic):'

      - uses: actions/upload-artifact@v7
        with:
          name: lkm
          path: dist/bakasu-sparrow-targetcfg.ko
          if-no-files-found: error

  ksud:
    name: ksud
    runs-on: ubuntu-latest
    needs: lkm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: lkm
          path: lkm

      - name: Embed LKM for late-load
        run: |
          mkdir -p userspace/ksud/bin/aarch64
          cp lkm/bakasu-sparrow-targetcfg.ko \
            userspace/ksud/bin/aarch64/${KMI}_kernelsu.ko

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 27.3.13750724

      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          DIR=$(dirname "$(find /usr/lib -name 'libclang-*.so*' | sort | tail -1)")
          echo "LIBCLANG_PATH=$DIR" >> "$GITHUB_ENV"
          echo "libclang: $DIR"

      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          RUSTUP_TOOLCHAIN: nightly
        run: |
          rustup default nightly
          rustup component add rust-src
          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$NDK/clang" --target=aarch64-linux-gnu -c -nostdlib \
            -o userspace/ksud/.lkm_image_bootstrap.o \
            userspace/ksud/src/lkm_image_bootstrap.S
          cd userspace/ksud
          CC_aarch64_linux_android="$NDK/aarch64-linux-android26-clang" \
          CXX_aarch64_linux_android="$NDK/aarch64-linux-android26-clang++" \
          AR_aarch64_linux_android="$NDK/llvm-ar" \
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/aarch64-linux-android26-clang" \
          cargo build --target aarch64-linux-android --release
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp target/aarch64-linux-android/release/ksud "$GITHUB_WORKSPACE/dist/ksud"
          chmod 755 "$GITHUB_WORKSPACE/dist/ksud"

      - uses: actions/upload-artifact@v7
        with:
          name: ksud
          path: dist/ksud
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lkm, ksud]
    if: ${{ github.ref_type == 'tag' || inputs.publish }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        shell: bash
        run: |
          ls -l
          sha256sum ksud bakasu-sparrow-targetcfg.ko > sha256sum.txt
          cat sha256sum.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'sparrow-artifacts' }}
          name: Sparrow artifacts
          body: |
            Generated by the Sparrow artifacts workflow.
            Verify each file against sha256sum.txt before use.
          files: |
            dist/ksud
            dist/bakasu-sparrow-targetcfg.ko
            dist/sha256sum.txt
          fail_on_unmatched_files: true
          prerelease: ${{ github.ref_type != 'tag' }}
